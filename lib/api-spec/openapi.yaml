openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NANP Carrier Selection Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: options
    description: Cascading dropdown options
  - name: formulations
    description: Formulation explorer
  - name: stats
    description: Database statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /options/diseases:
    get:
      operationId: getDiseaseOptions
      tags: [options]
      summary: All disease models in the database
      responses:
        "200":
          description: List of disease values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionList"

  /options/routes:
    get:
      operationId: getRouteOptions
      tags: [options]
      summary: Routes of administration, optionally filtered by disease
      parameters:
        - name: disease
          in: query
          required: false
          description: When provided, returns only routes that have evidence for this disease model
          schema:
            type: string
      responses:
        "200":
          description: List of route values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionList"

  /options/formulations:
    get:
      operationId: getFormulationOptions
      tags: [options]
      summary: Formulations studied for a specific disease and route
      parameters:
        - name: disease
          in: query
          required: true
          schema:
            type: string
        - name: route
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of matching formulations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormulationList"

  /formulation/{id}:
    get:
      operationId: getFormulationDetail
      tags: [formulations]
      summary: Full detail for one formulation — advantages, limitations, materials, papers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Formulation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormulationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /stats:
    get:
      operationId: getDatabaseStats
      tags: [stats]
      summary: Get database statistics
      responses:
        "200":
          description: Database statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStats"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    OptionList:
      type: object
      required: [values]
      properties:
        values:
          type: array
          items:
            type: string
          description: Distinct values from the database, alphabetically sorted

    FormulationSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        carrier_family:
          type: ["string", "null"]
        carrier_subtype:
          type: ["string", "null"]

    FormulationList:
      type: object
      required: [formulations]
      properties:
        formulations:
          type: array
          items:
            $ref: "#/components/schemas/FormulationSummary"

    FormulationPaper:
      type: object
      required: [title]
      properties:
        title:
          type: ["string", "null"]
        authors:
          type: ["string", "null"]
        journal:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        doi:
          type: ["string", "null"]

    FormulationDetail:
      type: object
      required: [id, name, advantages, limitations, mechanisms, materials, papers]
      properties:
        id:
          type: string
        name:
          type: string
        carrier_family:
          type: ["string", "null"]
        carrier_subtype:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        materials:
          type: array
          items:
            type: string
        advantages:
          type: array
          items:
            type: string
          description: Beneficial outcomes and supporting mechanisms from the database
        limitations:
          type: array
          items:
            type: string
          description: Known limitations directly from the database records
        mechanisms:
          type: array
          items:
            type: string
          description: Delivery mechanism statements from the database
        papers:
          type: array
          items:
            $ref: "#/components/schemas/FormulationPaper"

    DatabaseStats:
      type: object
      required:
        - total_papers
        - total_formulations
        - total_materials
        - total_experiments
        - total_biological_outcomes
      properties:
        total_papers:
          type: integer
        total_formulations:
          type: integer
        total_materials:
          type: integer
        total_experiments:
          type: integer
        total_biological_outcomes:
          type: integer
