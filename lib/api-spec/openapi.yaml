openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NANP Carrier Selection Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: carriers
    description: Carrier matching and ranking
  - name: browse
    description: Browse and detail operations over database records
  - name: recommend
    description: AI-synthesized carrier recommendation
  - name: options
    description: Filter option values
  - name: stats
    description: Database statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /carriers/match:
    post:
      operationId: matchCarriers
      tags: [carriers]
      summary: Match and rank carriers for a filter combination
      description: >
        Accepts any combination of cargo type, disease, and route and returns the
        carrier formulations the database actually links to that combination, ranked
        by strength of database support. Partial filters narrow correctly; an empty
        filter returns everything (paged). Never returns the whole table when filters
        are set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarrierMatchInput"
      responses:
        "200":
          description: Ranked list of matching carriers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierMatchResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /recommend:
    post:
      operationId: getRecommendation
      tags: [recommend]
      summary: Get AI-synthesized carrier recommendation
      description: >
        Runs the same database filter/ranking as /carriers/match, then feeds only the
        truly-filtered top carriers to an LLM that produces a secondary narrative. The
        ranked database results are authoritative; the narrative is supplementary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationInput"
      responses:
        "200":
          description: Ranked carriers plus AI narrative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /formulations:
    get:
      operationId: listFormulations
      tags: [browse]
      summary: Browse formulations
      description: Paged, text-searchable list of carrier formulations
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DiseaseFilter"
        - $ref: "#/components/parameters/RouteFilter"
        - $ref: "#/components/parameters/CargoFilter"
        - $ref: "#/components/parameters/MaterialFilter"
        - $ref: "#/components/parameters/EvidenceFilter"
      responses:
        "200":
          description: Paged formulations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormulationListResult"

  /formulations/{formulationId}:
    get:
      operationId: getFormulationDetail
      tags: [browse]
      summary: Get one formulation with all related records
      parameters:
        - name: formulationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Formulation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormulationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /materials:
    get:
      operationId: listMaterials
      tags: [browse]
      summary: Browse materials
      description: Paged, text-searchable list of materials
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged materials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialListResult"

  /papers:
    get:
      operationId: listPapers
      tags: [browse]
      summary: Browse papers
      description: Paged, text-searchable list of source papers
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged papers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperListResult"

  /outcomes:
    get:
      operationId: listOutcomes
      tags: [browse]
      summary: Browse biological outcomes
      description: Paged, text-searchable list of biological outcomes
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeListResult"

  /options:
    get:
      operationId: getFilterOptions
      tags: [options]
      summary: Get all filter option values
      description: Returns distinct cargo types, diseases, and routes from the database
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterOptions"

  /options/cargos:
    get:
      operationId: getCargoOptions
      tags: [options]
      summary: Get nucleic acid / cargo types
      description: Returns distinct cargo types from the database, deduplicated and alphabetized
      responses:
        "200":
          description: List of cargo types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionList"

  /options/diseases:
    get:
      operationId: getDiseaseOptions
      tags: [options]
      summary: Get disease / disease model values
      description: Returns distinct disease models from the database, deduplicated and alphabetized
      responses:
        "200":
          description: List of disease values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionList"

  /options/routes:
    get:
      operationId: getRouteOptions
      tags: [options]
      summary: Get routes of administration
      description: Returns distinct routes of administration from the database, deduplicated and alphabetized. When `disease` is provided, only routes that have ≥1 matching formulation for that disease are returned.
      parameters:
        - name: disease
          in: query
          required: false
          schema:
            type: string
          description: Filter to routes that have evidence for this disease model
      responses:
        "200":
          description: List of route values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionList"

  /stats:
    get:
      operationId: getDatabaseStats
      tags: [stats]
      summary: Get database statistics
      description: Returns summary statistics about the scientific literature database
      responses:
        "200":
          description: Database statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStats"

components:
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: Case-insensitive text search across key fields
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page number
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Number of records per page
    DiseaseFilter:
      name: disease
      in: query
      required: false
      schema:
        type: string
      description: Include formulations with an experimental arm linked to this disease model
    RouteFilter:
      name: route
      in: query
      required: false
      schema:
        type: string
      description: Include formulations using this arm route or recorded intended route
    CargoFilter:
      name: cargo_type
      in: query
      required: false
      schema:
        type: string
      description: Include formulations linked to this cargo type
    MaterialFilter:
      name: material
      in: query
      required: false
      schema:
        type: string
      description: Exact material name, abbreviation, class, or ID
    EvidenceFilter:
      name: evidence
      in: query
      required: false
      schema:
        type: string
        enum: [with_arms, with_outcomes, disease_linked, no_disease_link]
      description: Filter by the type of evidence recorded for a formulation

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CarrierMatchInput:
      type: object
      properties:
        cargo_type:
          type: ["string", "null"]
          description: Nucleic-acid / cargo type (e.g. mRNA, siRNA, plasmid_DNA)
        disease:
          type: ["string", "null"]
          description: Disease model (e.g. cystic fibrosis, lung cancer)
        route:
          type: ["string", "null"]
          description: Administration route (e.g. inhalation, intratracheal)
        page:
          type: ["integer", "null"]
          minimum: 1
        page_size:
          type: ["integer", "null"]
          minimum: 1
          maximum: 200

    RecommendationInput:
      type: object
      required:
        - nucleic_acid
        - disease
        - route_of_administration
      properties:
        nucleic_acid:
          type: string
          description: The therapeutic nucleic acid / cargo type (e.g. mRNA, siRNA, plasmid_DNA)
        disease:
          type: string
          description: The target disease model
        route_of_administration:
          type: string
          description: The intended delivery route (e.g. inhalation, intratracheal)

    PaperSummary:
      type: object
      required:
        - paper_id
      properties:
        paper_id:
          type: string
        title:
          type: ["string", "null"]
        authors_text:
          type: ["string", "null"]
        journal:
          type: ["string", "null"]
        publication_year:
          type: ["integer", "null"]
        doi:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        publication_type:
          type: ["string", "null"]

    CarrierMaterial:
      type: object
      required:
        - material_id
      properties:
        material_id:
          type: string
        canonical_name:
          type: ["string", "null"]
        abbreviation:
          type: ["string", "null"]
        material_class:
          type: ["string", "null"]
        material_role:
          type: ["string", "null"]

    CarrierCargo:
      type: object
      required:
        - cargo_id
      properties:
        cargo_id:
          type: string
        canonical_name:
          type: ["string", "null"]
        cargo_type:
          type: ["string", "null"]
        cargo_role:
          type: ["string", "null"]

    CarrierMatch:
      type: object
      required:
        - formulation_id
        - materials
        - cargos
        - matched_cargo_types
        - matched_routes
        - matched_disease_models
        - matching_arm_count
        - supporting_outcome_count
        - favorable_outcome_count
        - adverse_outcome_count
        - score
      properties:
        formulation_id:
          type: string
        formulation_name:
          type: ["string", "null"]
        carrier_family:
          type: ["string", "null"]
        carrier_subtype:
          type: ["string", "null"]
        architecture:
          type: ["string", "null"]
        optimized_flag:
          type: ["boolean", "null"]
        intended_route:
          type: ["string", "null"]
        intended_mucosal_site:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        paper:
          oneOf:
            - $ref: "#/components/schemas/PaperSummary"
            - type: "null"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/CarrierMaterial"
        cargos:
          type: array
          items:
            $ref: "#/components/schemas/CarrierCargo"
        matched_cargo_types:
          type: array
          items:
            type: string
        matched_routes:
          type: array
          items:
            type: string
        matched_disease_models:
          type: array
          items:
            type: string
        matching_arm_count:
          type: integer
        supporting_outcome_count:
          type: integer
        favorable_outcome_count:
          type: integer
        adverse_outcome_count:
          type: integer
        score:
          type: number

    CarrierMatchResult:
      type: object
      required:
        - total
        - page
        - page_size
        - filters
        - items
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        filters:
          $ref: "#/components/schemas/AppliedFilters"
        items:
          type: array
          items:
            $ref: "#/components/schemas/CarrierMatch"

    AppliedFilters:
      type: object
      properties:
        cargoType:
          type: ["string", "null"]
        disease:
          type: ["string", "null"]
        route:
          type: ["string", "null"]

    RecommendationResult:
      type: object
      required:
        - filters
        - ranked_carriers
        - ai_synthesis
      properties:
        filters:
          $ref: "#/components/schemas/AppliedFilters"
        ranked_carriers:
          type: array
          items:
            $ref: "#/components/schemas/CarrierMatch"
          description: Authoritative ranked list from the database
        ai_synthesis:
          oneOf:
            - $ref: "#/components/schemas/AiSynthesis"
            - type: "null"
          description: Secondary AI narrative grounded in the ranked carriers

    AiSynthesis:
      type: object
      required:
        - recommended_carrier
        - confidence
        - scientific_rationale
      properties:
        recommended_carrier:
          type: string
        confidence:
          type: string
          enum: [high, moderate, low]
        scientific_rationale:
          type: string
        key_components:
          type: array
          items:
            type: string
        advantages:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string

    FormulationListItem:
      type: object
      required:
        - formulation_id
        - match_tier
        - matched_filter_count
        - active_filter_count
      properties:
        formulation_id:
          type: string
        formulation_name:
          type: ["string", "null"]
        carrier_family:
          type: ["string", "null"]
        carrier_subtype:
          type: ["string", "null"]
        architecture:
          type: ["string", "null"]
        optimized_flag:
          type: ["boolean", "null"]
        intended_route:
          type: ["string", "null"]
        intended_mucosal_site:
          type: ["string", "null"]
        paper_id:
          type: ["string", "null"]
        paper_title:
          type: ["string", "null"]
        cargo_types:
          type: array
          items:
            type: string
        material_names:
          type: array
          items:
            type: string
        evidence_routes:
          type: array
          items:
            type: string
        disease_models:
          type: array
          items:
            type: string
        experimental_arm_count:
          type: integer
        disease_evidence_count:
          type: integer
        outcome_count:
          type: integer
        match_tier:
          type: string
          enum: [direct, partial, catalog]
          description: Direct same-arm match, independently related evidence, or an unmatched catalog record
        matched_filter_count:
          type: integer
          description: Number of active cargo, disease, and route inputs supported by this formulation
        active_filter_count:
          type: integer
          description: Number of active cargo, disease, and route inputs in the query

    FormulationListResult:
      type: object
      required:
        - total
        - page
        - page_size
        - items
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/FormulationListItem"

    FormulationDetail:
      type: object
      required:
        - formulation_id
        - materials
        - cargos
        - targeting
        - processes
        - physicochemical
        - arms
        - mechanisms
        - limitations
      properties:
        formulation_id:
          type: string
        formulation_name:
          type: ["string", "null"]
        carrier_family:
          type: ["string", "null"]
        carrier_subtype:
          type: ["string", "null"]
        architecture:
          type: ["string", "null"]
        optimized_flag:
          type: ["boolean", "null"]
        intended_route:
          type: ["string", "null"]
        intended_mucosal_site:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        paper:
          oneOf:
            - $ref: "#/components/schemas/PaperSummary"
            - type: "null"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/CarrierMaterial"
        cargos:
          type: array
          items:
            $ref: "#/components/schemas/CarrierCargo"
        targeting:
          type: array
          items:
            $ref: "#/components/schemas/FormulationTargeting"
        processes:
          type: array
          items:
            $ref: "#/components/schemas/FormulationProcess"
        physicochemical:
          type: array
          items:
            $ref: "#/components/schemas/PhysicochemicalMeasurement"
        arms:
          type: array
          items:
            $ref: "#/components/schemas/FormulationArm"
        mechanisms:
          type: array
          items:
            $ref: "#/components/schemas/FormulationMechanism"
        limitations:
          type: array
          items:
            $ref: "#/components/schemas/FormulationLimitation"

    FormulationTargeting:
      type: object
      required:
        - targeting_id
      properties:
        targeting_id:
          type: string
        target_type:
          type: ["string", "null"]
        target_name:
          type: ["string", "null"]
        target_cell_type:
          type: ["string", "null"]
        targeting_strategy:
          type: ["string", "null"]

    FormulationProcess:
      type: object
      required:
        - process_id
      properties:
        process_id:
          type: string
        process_stage:
          type: ["string", "null"]
        method:
          type: ["string", "null"]
        device:
          type: ["string", "null"]

    PhysicochemicalMeasurement:
      type: object
      required:
        - measurement_id
      properties:
        measurement_id:
          type: string
        metric_code:
          type: ["string", "null"]
        value_numeric:
          type: ["number", "null"]
        value_text:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]

    FormulationArm:
      type: object
      required:
        - arm_id
        - outcomes
      properties:
        arm_id:
          type: string
        experiment_id:
          type: ["string", "null"]
        arm_name:
          type: ["string", "null"]
        administration_route:
          type: ["string", "null"]
        administration_site:
          type: ["string", "null"]
        delivery_device:
          type: ["string", "null"]
        dose_value:
          type: ["number", "null"]
        dose_unit:
          type: ["string", "null"]
        number_of_doses:
          type: ["integer", "null"]
        experiment_type:
          type: ["string", "null"]
        objective:
          type: ["string", "null"]
        disease_model:
          type: ["string", "null"]
        species:
          type: ["string", "null"]
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/Outcome"

    FormulationMechanism:
      type: object
      required:
        - mechanism_id
      properties:
        mechanism_id:
          type: string
        experiment_id:
          type: ["string", "null"]
        mechanism_category:
          type: ["string", "null"]
        mechanism_statement:
          type: ["string", "null"]
        evidence_status:
          type: ["string", "null"]
        evidence_method:
          type: ["string", "null"]
        biological_level:
          type: ["string", "null"]
        source_text:
          type: ["string", "null"]
        source_location:
          type: ["string", "null"]

    FormulationLimitation:
      type: object
      required:
        - limitation_id
      properties:
        limitation_id:
          type: string
        experiment_id:
          type: ["string", "null"]
        limitation_category:
          type: ["string", "null"]
        limitation_statement:
          type: ["string", "null"]
        scope:
          type: ["string", "null"]
        severity:
          type: ["string", "null"]
        author_reported:
          type: ["boolean", "null"]
        source_text:
          type: ["string", "null"]
        source_location:
          type: ["string", "null"]

    Outcome:
      type: object
      required:
        - outcome_id
      properties:
        outcome_id:
          type: string
        arm_id:
          type: ["string", "null"]
        outcome_domain:
          type: ["string", "null"]
        metric_code:
          type: ["string", "null"]
        target_tissue:
          type: ["string", "null"]
        value_numeric:
          type: ["number", "null"]
        value_operator:
          type: ["string", "null"]
        value_text:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        direction_vs_comparator:
          type: ["string", "null"]
        result_polarity:
          type: ["string", "null"]
        fold_change:
          type: ["number", "null"]
        p_value:
          type: ["number", "null"]
        result_interpretation:
          type: ["string", "null"]

    OutcomeListResult:
      type: object
      required:
        - total
        - page
        - page_size
        - items
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Outcome"

    MaterialListItem:
      type: object
      required:
        - material_id
      properties:
        material_id:
          type: string
        canonical_name:
          type: ["string", "null"]
        abbreviation:
          type: ["string", "null"]
        material_class:
          type: ["string", "null"]
        chemical_subclass:
          type: ["string", "null"]
        ionizable_flag:
          type: ["boolean", "null"]
        apparent_pka:
          type: ["number", "null"]
        molecular_weight_da:
          type: ["number", "null"]

    MaterialListResult:
      type: object
      required:
        - total
        - page
        - page_size
        - items
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/MaterialListItem"

    PaperListResult:
      type: object
      required:
        - total
        - page
        - page_size
        - items
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaperSummary"

    OptionList:
      type: object
      required:
        - values
      properties:
        values:
          type: array
          items:
            type: string
          description: Distinct values from the database, alphabetically sorted

    FilterOptions:
      type: object
      required:
        - cargo_types
        - diseases
        - routes
      properties:
        cargo_types:
          type: array
          items:
            type: string
        diseases:
          type: array
          items:
            type: string
        routes:
          type: array
          items:
            type: string

    DatabaseStats:
      type: object
      required:
        - total_papers
        - total_formulations
        - total_materials
        - total_experiments
        - total_biological_outcomes
      properties:
        total_papers:
          type: integer
        total_formulations:
          type: integer
        total_materials:
          type: integer
        total_experiments:
          type: integer
        total_biological_outcomes:
          type: integer
